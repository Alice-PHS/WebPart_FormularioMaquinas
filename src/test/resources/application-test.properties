# Perfil "test": nao conecta no banco real.
# H2 em memoria no modo de compatibilidade com SQL Server (a app usa mssql-jdbc em prod).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Credenciais Graph fake so para o contexto subir (o warmup engole a falha de rede).
azure.tenant-id=00000000-0000-0000-0000-000000000000
azure.client-id=00000000-0000-0000-0000-000000000000
azure.client-secret=fake-secret-para-testes

# JWT (modulo Auth) - chave dummy so para o teste de contexto.
phs.jwt.secret=chave-de-teste-chave-de-teste-chave-de-teste-123456
phs.jwt.issuer=https://phsbrasil.com.br/
phs.jwt.audience=formulario-maquinas
phs.jwt.expiration-minutes=180

# 2o datasource (chamados / NetworkSolution) - H2 no teste.
phs.chamados.datasource.url=jdbc:h2:mem:chamadosdb;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
phs.chamados.datasource.driver-class-name=org.h2.Driver
phs.chamados.datasource.username=sa
phs.chamados.datasource.password=

# E-mail (Graph) - caixa fake so para o contexto subir.
phs.mail.from=no-reply@phsbrasil.com.br
